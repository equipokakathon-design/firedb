.4641,0.6788,0.695,-0.7376],"intercept":0.8381,"n":206,"n_ext":179,"auc":0.816,"acc":0.728,"base":0.869,"ranges":{"o2_frac":[0.12,0.34],"co2_frac":[0.0,0.7],"he_frac":[0.0,0.45],"presion_atm":[0.692,3.052],"diametro_mm":[1.1,4.67],"heptane":[0.0,1.0]}},"quality":[{"categoria":"missing","n":94},{"categoria":"excel","n":38},{"categoria":"format","n":27},{"categoria":"entry","n":22}],"pillars":[{"pilar_principal":"prevención","investigaciones":7,"pruebas":596,"sesiones":18},{"pilar_principal":"fundamental","investigaciones":7,"pruebas":554,"sesiones":76},{"pilar_principal":"supresión","investigaciones":1,"pruebas":274,"sesiones":0},{"pilar_principal":"detección","investigaciones":3,"pruebas":109,"sesiones":22},{"pilar_principal":"gravedad parcial","investigaciones":1,"pruebas":0,"sesiones":20}],"kpi":{"investigaciones":19,"pruebas":1533,"sesiones":136,"o2_30":476,"zona_lunar":66,"solidos_o2_30":0,"solido_o2_max":22.2,"correcciones":181,"excluidos_mapa":21},"context":"FIREDB CONTEXT (source: NASA Physical Sciences Informatics, PSI; cleaned and unified by the team).\nUnits: oxygen as % by volume, pressure in atm. Lunar base atmosphere assumed: >=30% O2 at <=0.69 atm (10.2 psi). Spacesuit: 100% O2 at 0.29 atm. ISS/Earth: 21% O2 at 1 atm.\nCaveat: in inverse flames (CFI-G, Flame Design) the O2 value is the burner oxidizer, not the ambient.\nCaveat: BASS-II and Saffire tables do not record pressure (cabin ~1 atm). No partial-gravity combustion data exists in PSI; ACME E-FIELD is the only analog.\n\nINVESTIGATIONS (code | PSI ID | pillar | fuel phase | hardware | tests | sessions | O2 range % | pressure range atm | objective | limitations):\n- BASS | PSI-26 | prevención | sólido | MSG – SPICE flow duct | 121 | 0 | n/a | n/a | Study flame spread and extinction over solid fuels (PMMA, SIBAL cotton-fiberglass fabric, Nomex, candle wax) in low-speed airflow in microgravity. | The PSI table only lists date, test number and material; no oxygen, flow or outcomes.\n- BASS-II | PSI-25 | prevención | sólido | MSG – SPICE flow duct | 129 | 0 | 13.6-22.2 | n/a | Measure flame spread, extinction and flammability limits of solids (PMMA films and rods, SIBAL, Nomex) while varying airflow and oxygen concentration (nitrogen dilution). | Airflow is recorded as display readings (Fan/Air display), often several per test.\n- SAFFIRE-I | PSI-98 | prevención | sólido | Saffire module (flow duct + avionics bay) | 2 | 0 | 21.5-21.6 | n/a | Determine how fast a large-scale fire grows in low gravity, on a ~94 × 40 cm SIBAL fabric sample at 20 cm/s. | Only 2 samples (concurrent and opposed flow).\n- SAFFIRE-II | PSI-99 | prevención | sólido | Saffire module | 9 | 0 | 21.5-22.1 | n/a | Compare low-gravity flammability limits with the ground test NASA-STD-6001 Test 1, using 9 samples of 5 × 29 cm. | 9 samples; two have no material in the table (inferred from the 2016 paper).\n- SAFFIRE-III | PSI-100 | prevención | sólido | Saffire module | 2 | 0 | n/a | n/a | Repeat the large-scale Saffire-I fire with a 30 cm/s airflow. | The PSI table has no oxygen or burn time.\n- ACME-BRE | PSI-20 | prevención | gas | CIR – modular ACME hardware | 0 | 18 | 21.0-40.0 | n/a | Emulate the burning of solid materials with a gas burner to study flammability in quiescent atmospheres as a function of material properties. | Summary per test day; pressure not reported.\n- SAME | PSI-102 | detección | sólido (pirólisis) | MSG | 0 | 20 | n/a | n/a | Measure the particle size distribution of smoke from spacecraft materials in microgravity and evaluate the ISS and Space Shuttle smoke detectors. | The PSI table is the test matrix (4 conditions × 5 materials).\n- SAME-R | PSI-101 | detección | sólido (pirólisis) | MSG | 109 | 0 | n/a | n/a | Repeat and extend SAME: characterize smoke from spacecraft materials under different flows and aging times. | Dates have no year.\n- DAFT | PSI-47 | detección | n/a (polvo) | Handheld instruments (P-Trak, DustTrak) | 0 | 2 | n/a | n/a | Demonstrate in microgravity the P-Trak particle counter (later used in SAME) and distinguish dust from smoke. | 2 sessions.\n- FLEX | PSI-69 | supresión | líquido | CIR – MDCA | 274 | 0 | 12.0-34.0 | 0.69-3.05 | Determine extinction conditions of fuel droplets in atmospheres diluted with CO2 and helium, as a basis for spacecraft fire suppression. | -\n- FLEX-2 | PSI-68 | fundamental | líquido | CIR – MDCA | 0 | 8 | 17.0-30.0 | 0.50-3.00 | Basic droplet combustion science: pure fuels and mixtures, slow convection and droplet arrays; radiative and diffusive extinction limits. | The PSI table is only the envelope of conditions (ranges).\n- ACME-CFI-G | PSI-159 | prevención | gas | CIR – modular ACME hardware | 333 | 0 | 12.0-85.0 | 0.49-3.27 | Study cool and hot flames of gases (ethane, propane, butane) on a spherical burner; inverse flames reach up to 85% oxygen, the highest tested in microgravity. | Many empty rows in the inverse-flame table.\n- ACME-FLAME-DESIGN | PSI-10 | fundamental | gas | CIR – modular ACME hardware | 327 | 0 | 19.8-85.0 | 0.43-3.02 | Study soot formation in normal and inverse spherical flames by varying the stoichiometric mixture fraction; includes oxygen up to 85%. | -\n- ACME-E-FIELD | PSI-22 | gravedad parcial | gas | CIR – modular ACME hardware | 0 | 20 | n/a | n/a | Apply an electric field to flames to create an ionic wind; the closest analog to partial gravity available in PSI. | Summary per test day.\n- CFI | PSI-39 | fundamental | líquido | CIR – MDCA | 227 | 0 | 17.0-21.0 | 0.50-5.00 | Study the transition from hot flames to cool flames in fuel droplets in microgravity. | Data from the CFI_DataSummary spreadsheet (January 2021).\n- ACME-CLD | PSI-21 | fundamental | gas | CIR – modular ACME hardware | 0 | 32 | n/a | n/a | Study structure, soot and stability of laminar coflow diffusion flames. | Summary per test day.\n- ACME-S-FLAME | PSI-23 | fundamental | gas | CIR – modular ACME hardware | 0 | 18 | 21.0-30.0 | 1.00-1.00 | Measure structure and extinction of spherical diffusion flames with H2, CH4 and C2H4 in N2 or He atmospheres with 21–30% oxygen. | Summary per test day.\n- SLICE | PSI-106 | fundamental | gas | MSG – SPICE flow duct | 0 | 12 | n/a | n/a | Study the structure and liftoff of coflow jet flames in microgravity. | Summary per test day.\n- SPICE | PSI-107 | fundamental | gas | MSG – SPICE flow duct | 0 | 6 | 21.0-21.0 | 1.00-1.00 | Find the smoke-point properties (the largest flame that emits no soot) of non-buoyant jet flames for several fuels, nozzle diameters and coflow speeds. | No experimental table in PSI; the planned matrix from the SRD is used (84 flames).\n\nKEY FINDINGS:\n- Tests with O2 >= 30%: 476. Inside the lunar-base zone (O2>=30% and <=0.69 atm): 66 (ACME-CFI-G 48, ACME-FLAME-DESIGN 18), all gaseous fuels.\n- Solid materials tested with O2 >= 30%: 0. Maximum O2 with solids: 22.2%.\n- Tests per pillar: prevención 596 tests / 18 sessions / 7 investigations; fundamental 554 tests / 76 sessions / 7 investigations; supresión 274 tests / 0 sessions / 1 investigations; detección 109 tests / 22 sessions / 3 investigations; gravedad parcial 0 tests / 20 sessions / 1 investigations\n- FLEX extinction by diluent: N2: 58/101 extinguished (57%), mean O2 20.7%; N2+CO2: 88/123 extinguished (72%), mean O2 20.1%; N2+He: 40/50 extinguished (80%), mean O2 18.7%. Helium tests had lower mean O2, so this is a trend, not a controlled comparison.\n- BASS-II solids (material, geometry, tests, O2 range %): Nomex tela 3 tests 21.0-22.2; PMMA esfera 2 tests 17.2-17.3; PMMA película 22 tests 15.0-22.2; PMMA placa 20 tests 17.9-22.2; PMMA varilla 54 tests 13.6-22.2; SIBAL (algodón/fibra de vidrio) tela 27 tests 16.4-20.8; cera japonesa vela 1 tests 17.4-17.4\n- FLEX logistic model (extinction vs complete burn, n=206): cross-validated AUC 0.816.\n- Data quality: 181 corrections logged (missing data, Excel autofill errors, impossible values, format issues).","faq":[{"k":"lunar moon base luna lunar solid sólidos 30 oxygen oxígeno gap vacío","en":"No solid material (fabrics, plastics, foams) has been tested in microgravity at 30% oxygen or more. Solids reach at most 22.2% O2 (BASS-II, Saffire). Of 476 tests with ≥30% O2, only 66 sit inside the lunar-base zone (≤0.69 atm), all with gaseous fuels: ACME CFI-G (PSI-159) and ACME Flame Design (PSI-10).","es":"Ningún material sólido (telas, plásticos, espumas) se ha probado en microgravedad con 30 % de oxígeno o más. Los sólidos llegan como máximo a 22.2 % de O₂ (BASS-II, Saffire). De 476 pruebas con ≥30 % de O₂, solo 66 están en la zona Base Lunar (≤0,69 atm), todas con gases: ACME CFI-G (PSI-159) y ACME Flame Design (PSI-10)."},{"k":"suppression supresión extinguish apagar co2 helium helio flex agent agente","en":"In FLEX (PSI-69), the share of droplet flames that extinguished was 57% with nitrogen only, 72% with added CO2 and 80% with added helium. Helium tests also had lower oxygen on average (18.7% vs 20.7%), so treat it as a trend.","es":"En FLEX (PSI-69), la proporción de llamas de gota que se apagaron fue 57 % solo con nitrógeno, 72 % con CO₂ y 80 % con helio. Las pruebas con helio tenían además menos oxígeno en promedio (18.7 % vs 20.7 %), así que es una tendencia."},{"k":"detection detección smoke humo detector same sensor dust polvo","en":"Smoke detection was studied in SAME (PSI-102) and SAME-R (PSI-101): particle size distributions of smoke from spacecraft materials (Teflon, Kapton, silicone, cotton wick, Pyrell) and the response of ISS and Shuttle smoke detectors. DAFT (PSI-47) tested the P-Trak particle counter with dust, to help distinguish dust from smoke.","es":"La detección de humo se estudió en SAME (PSI-102) y SAME-R (PSI-101): tamaño de las partículas de humo de materiales de naves (Teflón, Kapton, silicona, mecha de algodón, Pyrell) y respuesta de los detectores de la ISS y del transbordador. DAFT (PSI-47) probó el contador P-Trak con polvo, para distinguir polvo de humo."},{"k":"highest oxygen máximo oxígeno 85 cfi-g inverse inversa","en":"The highest oxygen levels in microgravity were tested in ACME CFI-G (PSI-159) and ACME Flame Design (PSI-10): inverse spherical flames with up to 85% oxygen flowing from the burner. Note that this is the burner oxidizer, not the cabin atmosphere.","es":"Los niveles de oxígeno más altos en microgravedad se probaron en ACME CFI-G (PSI-159) y ACME Flame Design (PSI-10): llamas esféricas inversas con hasta 85 % de oxígeno saliendo del quemador. Ojo: es el oxidante del quemador, no la atmósfera de la cabina."},{"k":"partial gravity gravedad parcial mars marte moon 0.16 0.38 e-field","en":"PSI has no partial-gravity combustion data yet (future: LUCI, FM2). ACME E-FIELD (PSI-22) is the only analog: an electric field creates an ionic wind that mimics buoyancy. Saffire-II (PSI-99) also lists 1-g results next to microgravity ones, which helps bracket intermediate gravity.","es":"PSI aún no tiene datos de combustión en gravedad parcial (a futuro: LUCI, FM2). ACME E-FIELD (PSI-22) es el único análogo: un campo eléctrico crea un viento iónico que imita la flotación. Saffire-II (PSI-99) también reporta resultados en 1-g junto a los de microgravedad, lo que ayuda a acotar gravedades intermedias."},{"k":"materials materiales nomex pmma sibal fabric tela plastic plástico bass","en":"Solids tested: PMMA (rods, films, slabs, spheres), SIBAL cotton-fiberglass fabric, Nomex, silicone, Ultem and candle wax, in BASS (PSI-26), BASS-II (PSI-25) and Saffire I–III (PSI-98/99/100). In BASS-II all were tested between 13.6% and 22.2% O2; Nomex has only 3 tests.","es":"Sólidos probados: PMMA (varillas, películas, placas, esferas), tela SIBAL de algodón y fibra de vidrio, Nomex, silicona, Ultem y cera, en BASS (PSI-26), BASS-II (PSI-25) y Saffire I–III (PSI-98/99/100). En BASS-II todos se probaron entre 13,6 % y 22,2 % de O₂; el Nomex tiene solo 3 pruebas."},{"k":"large scale gran escala saffire fire growth crecimiento","en":"Saffire I–III (PSI-98, 99, 100) burned samples at realistic scale on Cygnus after it left the ISS. Saffire-I's 94 × 40.6 cm SIBAL fabric burned for 420 s with concurrent flow versus 70 s with opposed flow, at 20 cm/s.","es":"Saffire I–III (PSI-98, 99, 100) quemaron muestras a escala real en Cygnus tras dejar la ISS. En Saffire-I, la tela SIBAL de 94 × 40,6 cm ardió 420 s con flujo concurrente frente a 70 s con flujo opuesto, a 20 cm/s."},{"k":"data quality calidad datos errors errores corrections correcciones","en":"The team found and logged 181 issues in the public PSI tables: missing materials, Excel autofill errors (e.g. 'CH5' for CH4), impossible values (year 2103, 0 mmHg), units inside values and notes mixed with data. Every fix is traceable to its file and row.","es":"El equipo encontró y registró 181 problemas en las tablas públicas de PSI: materiales sin nombre, errores de autollenado de Excel (p. ej. «CH5» en vez de CH4), valores imposibles (año 2103, 0 mmHg), unidades dentro del valor y notas mezcladas con los datos. Cada corrección se rastrea hasta su archivo y fila."}],"zone":{"ACME-CFI-G":48,"ACME-FLAME-DESIGN":18},"coverage":[{"code":"BASS","n":121,"o2":0.0,"pressure":0.0,"flow":0.0,"size":0.69,"outcome":0.0,"burntime":0.0,"temperature":0.0},{"code":"BASS-II","n":129,"o2":1.0,"pressure":0.0,"flow":0.95,"size":0.97,"outcome":0.0,"burntime":0.0,"temperature":0.0},{"code":"SAFFIRE-I","n":2,"o2":1.0,"pressure":0.0,"flow":1.0,"size":1.0,"outcome":0.0,"burntime":1.0,"temperature":0.0},{"code":"SAFFIRE-II","n":9,"o2":1.0,"pressure":0.0,"flow":1.0,"size":1.0,"outcome":1.0,"burntime":0.56,"temperature":0.0},{"code":"SAFFIRE-III","n":2,"o2":0.0,"pressure":0.0,"flow":1.0,"size":1.0,"outcome":0.0,"burntime":0.0,"temperature":0.0},{"code":"SAME-R","n":109,"o2":0.0,"pressure":0.0,"flow":1.0,"size":0.0,"outcome":1.0,"burntime":0.0,"temperature":0.0},{"code":"FLEX","n":274,"o2":1.0,"pressure":1.0,"flow":0.0,"size":0.96,"outcome":1.0,"burntime":0.98,"temperature":0.0},{"code":"ACME-CFI-G","n":333,"o2":1.0,"pressure":1.0,"flow":0.0,"size":0.0,"outcome":1.0,"burntime":0.99,"temperature":1.0},{"code":"ACME-FLAME-DESIGN","n":327,"o2":0.97,"pressure":0.94,"flow":0.0,"size":0.0,"outcome":0.0,"burntime":0.0,"temperature":0.78},{"code":"CFI","n":227,"o2":1.0,"pressure":1.0,"flow":0.0,"size":0.65,"outcome":1.0,"burntime":0.65,"temperature":0.0}]};

 recs:[["high","Materiales en cabinas con oxígeno enriquecido","Las bases lunares y los rovers usarán ≥ 30 % de O₂, lo que vuelve los materiales mucho más inflamables, pero ningún sólido se ha probado en microgravedad por encima de 22,2 % de O₂.","0 de 1,533 pruebas quemaron sólidos con ≥ 30 % de O₂; las llamas de gas siguieron encendidas hasta con 85 % de O₂ (CFI-G, Flame Design).","No confiar en límites de inflamabilidad medidos con 21 % de O₂. Evaluar cada material de cabina con el oxígeno y la presión reales del hábitat antes del vuelo, y financiar pruebas de sólidos en microgravedad con ≥ 30 % de O₂.",["BASS-II","SAFFIRE-II","ACME-CFI-G","ACME-FLAME-DESIGN"],"low","Base lunar · Base marciana · Rover"],
  ["high","El flujo de aire alimenta el fuego","En microgravedad no hay flotación, así que la ventilación pasa a ser la principal fuente de oxígeno de una llama.","Saffire-I: la misma tela ardió 420 s con flujo concurrente frente a 70 s con flujo opuesto (20 cm/s). BASS-II varió el flujo de 0 a 49 cm/s.","Incluir el apagado automático de ventiladores en la respuesta a incendios y considerar la dirección del flujo al ubicar telas, espumas y electrónica.",["SAFFIRE-I","SAFFIRE-III","BASS-II"],"med","Todos los hábitats"],
  ["med","Alarmas de humo tardías o falsas","Las partículas de humo crecen distinto en microgravedad, y el polvo puede activar falsas alarmas.","SAME y SAME-R midieron humo de Teflón, Kapton, silicona, algodón y Pyrell y probaron los detectores de la ISS y del transbordador; DAFT probó un contador de partículas con polvo.","Usar detectores calibrados para el tamaño del humo en microgravedad y capaces de distinguir humo de polvo; probarlos con los materiales reales de la cabina.",["SAME","SAME-R","DAFT"],"med","Todos los hábitats"],
  ["med","Elegir la estrategia de supresión","El agua se comporta distinto en microgravedad; diluir el oxígeno es otra forma de apagar llamas.","FLEX: la extinción subió de 57 % (solo nitrógeno) a 72 % con CO₂ y 80 % con helio (tendencia; el oxígeno no fue igual). En BASS-II las llamas sólidas se apagaron al bajar el oxígeno hasta 13,6 %.","Evaluar la reducción de oxígeno y los agentes inertes (CO₂, helio) como parte de la supresión, validados con la atmósfera del hábitat y seguros para la tripulación.",["FLEX","BASS-II"],"med","Todos los hábitats"],

const SYS = `You are FireDB's assistant for the NASA Space Apps challenge "Flame in Freefall". Answer ONLY with facts from the FireDB context and tool results; never invent numbers. Cite PSI IDs (e.g. PSI-69) for every investigation you mention. If the data do not cover the question, say so clearly and name the closest available data. Mention relevant caveats (inverse-flame O2 is the burner's; BASS-II/Saffire have no pressure; no partial-gravity data in PSI; FLEX helium groups had lower O2). Be concise: 3–7 sentences or a short bullet list. Plain text; you may use **bold** and "- " bullets.`;
const TOOLS = [
  {name:"query_tests", description:"Filter FireDB tests that have an oxygen value and return counts grouped by investigation, fuel phase and outcome, plus O2/pressure ranges and up to 10 example tests. All filters optional. o2 in percent, pressure in atm. phase: solid|liquid|gas. investigation: code like FLEX, BASS-II, ACME-CFI-G.",

   execute(a){ const ph = {solid:0,liquid:1,gas:2}[String(a.phase||"").toLowerCase()];
     let r = PTS.filter(p => (!a.investigation || p.inv.codigo.toLowerCase() === String(a.investigation).toLowerCase()) && (ph == null || p.f === ph)
       && (a.o2_min == null || p.o2 >= a.o2_min) && (a.o2_max == null || p.o2 <= a.o2_max) && (a.p_min == null || (!p.assumed && p.p >= a.p_min)) && (a.p_max == null || (!p.assumed && p.p <= a.p_max))

     const g = (f) => r.reduce((m, p) => (m[f(p)] = (m[f(p)]||0) + 1, m), {});

       o2_range:r.length ? [Math.min(...r.map(p=>p.o2)), Math.max(...r.map(p=>p.o2))] : null,
       pressure_range:r.filter(p=>!p.assumed).length ? [Math.min(...r.filter(p=>!p.assumed).map(p=>p.p)), Math.max(...r.filter(p=>!p.assumed).map(p=>p.p))] : null,
       examples:r.slice(0,10).map(p => ({inv:p.inv.codigo, test:p.id, fuel:p.fuel, o2:p.o2, p_atm:p.assumed ? "not recorded" : p.p, outcome:VAL_EN[p.res] || p.res}))}; }},
  {name:"get_investigation", description:"Full profile of one investigation by code (e.g. FLEX, SAFFIRE-II, ACME-E-FIELD): objective, hardware, fuels, measurements, ranges, limitations and which variables changed between tests.",
   inputSchema:{type:"object",properties:{code:{type:"string"}},required:["code"]},
   execute(a){ const i = INV.find(x => x.codigo.toLowerCase() === String(a.code).toLowerCase()); if (!i) throw new Error("unknown code; valid: " + INV.map(x=>x.codigo).join(", "));

       tests_o2_30:i.n_o2_30, tests_lunar_zone:i.n_zona_lunar, limitations:i.limitaciones_en, variables:i.vars}; }}

function renderAnswer(text){
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n/);
  let html = "", inList = false;
  for (const l of lines){ const m = l.match(/^\s*[-•*]\s+(.*)/);
    if (m){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; }
    else { if (inList){ html += "</ul>"; inList = false; } if (l.trim()) html += `<p>${l}</p>`; } }
  if (inList) html += "</ul>";
  $("#aiA").innerHTML = html;
}
function faqAnswer(q){
  const words = q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9.\-]+/).filter(w => w.length > 2);
  let best = null, bs = 0;
  for (const f of D.faq){ const keys = f.k.normalize("NFD").replace(/[̀-ͯ]/g, "").split(" "); const sc = words.filter(w => keys.some(k => k.startsWith(w) || w.startsWith(k))).length; if (sc > bs){ bs = sc; best = f; } }
  if (!best){ renderAnswer(T().aiNoMatch); $("#aiE").textContent = ""; return; }
  renderAnswer(best[LANG]); $("#aiE").textContent = T().aiEngFaq;
}
let busy = false;
async function ask(q){
  if (busy || !q.trim()) return; busy = true; $("#aiA").innerHTML = `<p class="note">${esc(T().aiThinking)}</p>`; $("#aiE").textContent = "";
  const langName = LANG === "es" ? "Spanish" : "English";
  try {
    const sample = await Promise.race([samplePromise, new Promise(r => setTimeout(() => r(null), 4000))]);
    if (sample){
      try {
        const res = await sample(`${SYS}\nAnswer in ${langName}. Use the tools when you need test-level numbers.\n\n${D.context}\n\nQUESTION: ${q}`,
          {tools: TOOLS, modelTier: "default", cache: false, onText: ({text}) => renderAnswer(text)});
        renderAnswer(res.text); $("#aiE").textContent = T().aiEngClaude; busy = false; return;
      } catch(e){ /* not granted, rate limited or failed → next engine */ }
    }
    try {
      const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:q, lang:LANG, context:D.context})});
      if (r.ok){ const j = await r.json(); if (j.text){ renderAnswer(j.text); $("#aiE").textContent = T().aiEngGemini; busy = false; return; } }
    } catch(e){ /* no server function here */ }
    faqAnswer(q);
  } finally { busy = false; }
}

const HAB = {capsule:{o2:21,p:1,partial:false,vent:true}, station:{o2:21,p:1,partial:false,vent:true}, moon:{o2:30,p:0.69,partial:true,vent:false},
  mars:{o2:30,p:0.69,partial:true,vent:false}, rover:{o2:30,p:0.69,partial:true,vent:true}};
let habSel = "moon";
function habScore(i, h){
  const w = T().why, R = []; let s = 2 * i.relevancia_seguridad; R.push(`${w.rel} ${i.relevancia_seguridad}/5`);
  if (i.o2_min_frac != null && i.o2_min_frac*100 <= h.o2 + 0.5 && i.o2_max_frac*100 >= h.o2 - 0.5){ s += 3; R.push(w.o2); }
  if (i.presion_min_atm != null && i.presion_min_atm <= h.p + 0.05 && i.presion_max_atm >= h.p - 0.05){ s += 2; R.push(w.p); }
  if (faseKey(i.fase_combustible) === "sólido"){ s += 2; R.push(w.solid); }
  if (h.o2 >= 30 && i.n_zona_lunar > 0){ s += 2; R.push(w.zone); }
  if (h.partial && i.pilares.includes("gravedad parcial")){ s += 3; R.push(w.pg); }
  if (h.vent && i.flujo_max_cm_s > 0){ s += 1; R.push(w.flow); }
  if (i.pilares.includes("detección") || i.pilares.includes("supresión")){ s += 1; R.push(w.eq); }
  return {s, R};
}

  const ranked = INV.map(i => ({i, ...habScore(i, HAB[habSel])})).sort((a,b) => b.s - a.s || b.i.n_pruebas - a.i.n_pruebas).slice(0, 8);
  $("#habRank").innerHTML = ranked.map((r, k) => `<div class="rank"><span class="pos">${k+1}</span><div><button class="pill" type="button" data-code="${esc(r.i.codigo)}" style="font-weight:600;font-size:13px">${esc(r.i.codigo)}</button><div class="note">${esc(r.i.psi_id)} · ${esc(pilL(r.i.pilar_principal))}</div></div>

function renderCmp(){

  const sim = [], dif = [], ha = hwShort(a), hb = hwShort(b);

  a.proyecto === b.proyecto ? sim.push(c.sameProj(a.proyecto)) : dif.push(c.difProj(a.proyecto, b.proyecto));
  faseKey(a.fase_combustible) === faseKey(b.fase_combustible) ? sim.push(c.sameFuel(phL(faseKey(a.fase_combustible)))) : dif.push(c.difFuel(phL(a.fase_combustible), phL(b.fase_combustible)));
  const pa = new Set(a.pilares.split(";")), common = b.pilares.split(";").filter(p => pa.has(p));

}

/* ================= equipment, earth ================= */
function renderEquipment(){
  $("#eqCards").innerHTML = T().eq.map(([tag, h, codes, body, next]) => `<div class="card"><span class="tag">${esc(tag)}</span><h3>${esc(h)}</h3><p>${esc(body)}</p><p><b>${esc(next)}</b></p>
    <div class="meta">${codes.map(c => `<button class="pill" type="button" data-code="${esc(c)}">${esc(c)} · ${esc(byCode[c].psi_id)}</button>`).join("")}</div></div>`).join("");
  $("#eqCards").querySelectorAll("button[data-code]").forEach(b => b.onclick = () => openInv(b.dataset.code));
  $("#earthCards").innerHTML = T().earth.map(([h, b]) => `<div class="card"><h3>${esc(h)}</h3><p>${esc(b)}</p></div>`).join("");
}

/* ================= modelers ================= */
const ml = {o2_frac:21, co2_frac:0, he_frac:0, presion_atm:1, diametro_mm:3, heptane:0};
function renderModelers(){
  const tx = T(), cc = ["o2","pressure","flow","size","outcome","burntime","temperature"];
  const cell = v => v >= 0.95 ? `<span class="ok">✓</span>` : v > 0 ? `${fmt(v*100,0)} %` : `<span class="no">—</span>`;
  $("#covTable").innerHTML = `<thead><tr>${tx.covCols.map((c,i) => `<th class="${i?"num":""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>` + D.coverage.sort((a,b) => b.n - a.n).map(r => `<tr><td><button class="pill" type="button" data-code="${esc(r.code)}">${esc(r.code)}</button></td><td class="num">${fmt(r.n)}</td>${cc.map(k => `<td class="num">${cell(r[k])}</td>`).join("")}</tr>`).join("") + `</tbody>`;
  $("#covTable").querySelectorAll("button[data-code]").forEach(b => b.onclick = () => openInv(b.dataset.code));
  const M = D.model, R = M.ranges, pct = f => ["o2_frac","co2_frac","he_frac"].includes(f);
  $("#mlSliders").innerHTML = M.features.map(f => f === "heptane"
    ? `<div class="slider"><label for="ml_${f}">${esc(tx.ml[f])}</label><select id="ml_${f}">${tx.fuelOpt.map((o,i) => `<option value="${i}" ${ml.heptane===i?"selected":""}>${esc(o)}</option>`).join("")}</select><span></span></div>`
    : `<div class="slider"><label for="ml_${f}">${esc(tx.ml[f])}</label><input type="range" id="ml_${f}" min="${pct(f)?R[f][0]*100:R[f][0]}" max="${pct(f)?R[f][1]*100:R[f][1]}" step="${pct(f)?0.5:0.01}" value="${ml[f]}"><span id="mlv_${f}" class="note"></span></div>`).join("");
  M.features.forEach(f => { const el = $("#ml_"+f); el.oninput = () => { ml[f] = +el.value; calcML(); }; });
  $("#mlStats").textContent = tx.mlStats(M); calcML();
}
function calcML(){
  const M = D.model; let z = M.intercept;
  M.features.forEach((f, k) => { const raw = ["o2_frac","co2_frac","he_frac"].includes(f) ? ml[f]/100 : ml[f]; z += M.coef[k] * (raw - M.mean[k]) / M.scale[k];
    const lab = $("#mlv_"+f); if (lab) lab.textContent = ["o2_frac","co2_frac","he_frac"].includes(f) ? fmt(ml[f],1) + " %" : fmt(ml[f],2); });
  $("#mlP").textContent = fmt(100/(1+Math.exp(-z)), 0) + " %";
}

/* ================= render all ================= */
function renderAll(){ renderStatic(); renderOverview(); renderRecs(); renderAIEx(); renderHabitats(); renderMapControls(); renderMap(); renderCatalogControls(); renderCards(); renderCompareSelects(); renderCmp(); renderBars(); renderEquipment(); renderModelers(); }
renderAll();
showSection(location.hash.slice(1) || "overview", false);
window.addEventListener("resize", () => { clearTimeout(window._rp); window._rp = setTimeout(() => renderPanel(false), 150); });
</script>
